# Soundboard: a virtual microphone that mixes your real mic with the sounds.
# Pick "Soundboard Mic" as the input in Discord or any other app.
# install.sh renders this to ~/.config/pipewire/pipewire.conf.d/ with your mic.
context.modules = [
    # The virtual mic: apps see the source, sounds play into the sink.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Soundboard Mic"
            capture.props = {
                node.name        = "soundboard_mic_in"
                node.description = "Soundboard Mic (input)"
                media.class      = "Audio/Sink"
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "soundboard_mic"
                node.description = "Soundboard Mic"
                media.class      = "Audio/Source"
                audio.position   = [ FL FR ]
            }
        }
    }

    # Real mic -> RNNoise -> virtual mic. Only the voice is denoised, so
    # sounds never get cut. Needs noise-suppression-for-voice.
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Mic (RNNoise) -> Soundboard Mic"
            media.name       = "Mic (RNNoise) -> Soundboard Mic"
            filter.graph = {
                nodes = [
                    {   type    = ladspa
                        name    = rnnoise
                        plugin  = /usr/lib/ladspa/librnnoise_ladspa.so
                        label   = noise_suppressor_mono
                        control = {
                            # raise if noise gets through, lower if words get cut
                            "VAD Threshold (%)"          = 50.0
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name           = "soundboard_mic_bridge_in"
                target.object       = "@MIC@"
                stream.capture.sink = false
                node.passive        = true
            }
            playback.props = {
                node.name      = "soundboard_mic_bridge_out"
                media.class    = "Stream/Output/Audio"
                target.object  = "soundboard_mic_in"
            }
        }
    }
]
